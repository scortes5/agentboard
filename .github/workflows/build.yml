# Builds the installers on GitHub (Mac .dmg and Windows .exe).
# Runs when a v* tag is pushed (e.g. git tag v0.1.0 && git push --tags) or by hand from Actions.
# latest.yml and the .blockmap go with the .exe: the Windows app reads them to update itself.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: agentboard-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
      - name: Publish to the tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
